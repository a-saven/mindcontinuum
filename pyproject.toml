[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindcontinuum"
version = "0.2.2"
description = "Local-first long-term memory layer for AI conversations via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MindContinuum" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "mcp>=1.2",
    "fastembed>=0.4,<0.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Embeddings are bundled by default; this extra is kept as a no-op alias
# so older instructions like `pip install mindcontinuum[embeddings]` work.
embeddings = []

[project.scripts]
mindcontinuum = "mindcontinuum.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mindcontinuum = ["schema.sql", "static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
